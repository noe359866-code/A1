# Genera el APK de Android TV desde GitHub, sin instalar nada en tu máquina.
#
# Cómo se usa (2 clics):
#   1. Pestaña «Actions» → «Generar APK (Android TV)» → «Run workflow».
#   2. Al terminar (~10 min), el APK queda en el artefacto «OmniTV-apk-<versión>».
#      Si además marcas «publicar» desde main y con firma de producción,
#      aparece como Release versionada.
#
# Los pushes a main actualizan «latest» solo con firma de producción.
# Las etiquetas v* las gestiona release.yml.
#
# Diferencia con release.yml: este workflow SIEMPRE deja un APK descargable
# (artefacto), sin exigir keystore de producción y sin publicar una Release a
# menos que se pida. Es el botón «dame el APK» del proyecto.
name: Generar APK (Android TV)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variante a compilar"
        type: choice
        options: [release, debug]
        default: release
      publicar:
        description: "Publicar también una Release con el APK"
        type: boolean
        default: false
      version:
        description: "versionName para esta compilación (vacío = la del proyecto)"
        required: false
        default: ""
  push:
    # Cada push a main compila el APK y actualiza la Release «latest», que es
    # la que da el enlace permanente de descarga directa. Así siempre hay un
    # OmniTV.apk descargable sin pulsar nada.
    # Nota: este workflow no hace push al repositorio, así que no se repite
    # a sí mismo (el GITHUB_TOKEN tampoco generaría un evento nuevo).
    # Las etiquetas v* las publica release.yml: dos workflows publicando la
    # misma release competirían por el mismo tag.
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Aceptar las licencias del SDK de Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null; fi

      # Falla en segundos —y con un mensaje claro— si al proyecto le falta algo
      # para compilar (catálogo de versiones, wrapper, firma a medias…).
      - name: Preparación del proyecto
        run: |
          python3 tools/check_build_readiness.py
          python3 tools/check_android_tv.py

      - name: Variante y publicación
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          if [ -z "$VARIANT" ]; then VARIANT="release"; fi
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"

          PUBLISH="false"
          PUBLISH_DEV="false"
          # Una release versionada solo puede publicarse manualmente desde main,
          # con variante release y usando la versión declarada en el proyecto.
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publicar }}" = "true" ]; then
            if [ "$VARIANT" != "release" ]; then
              echo "::error::No se puede publicar una variante debug. Selecciona release."
              exit 1
            fi
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Las releases versionadas solo se pueden publicar desde main."
              exit 1
            fi
            if [ -n "${{ github.event.inputs.version }}" ]; then
              echo "::error::No sobrescribas versionName al publicar. Actualiza versionName y versionCode en app/build.gradle.kts."
              exit 1
            fi
            PUBLISH="true"
          fi
          # La release rodante se actualiza exclusivamente tras un push real a main.
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$VARIANT" = "release" ]; then
            PUBLISH_DEV="true"
          fi
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"
          echo "PUBLISH_DEV=$PUBLISH_DEV" >> "$GITHUB_ENV"
      - name: Preparar firma (si hay secretos)
        env:
          OMNITV_KEYSTORE_BASE64: ${{ secrets.OMNITV_KEYSTORE_BASE64 }}
          OMNITV_KEYSTORE_PASSWORD: ${{ secrets.OMNITV_KEYSTORE_PASSWORD }}
          OMNITV_KEY_ALIAS: ${{ secrets.OMNITV_KEY_ALIAS }}
          OMNITV_KEY_PASSWORD: ${{ secrets.OMNITV_KEY_PASSWORD }}
        run: |
          if [ -n "${OMNITV_KEYSTORE_BASE64:-}" ] && [ -n "${OMNITV_KEYSTORE_PASSWORD:-}" ] && [ -n "${OMNITV_KEY_ALIAS:-}" ]; then
            echo "$OMNITV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omnitv-release.jks"
            {
              echo "OMNITV_KEYSTORE_FILE=$RUNNER_TEMP/omnitv-release.jks"
              echo "OMNITV_KEYSTORE_PASSWORD=$OMNITV_KEYSTORE_PASSWORD"
              echo "OMNITV_KEY_ALIAS=$OMNITV_KEY_ALIAS"
              echo "OMNITV_KEY_PASSWORD=${OMNITV_KEY_PASSWORD:-$OMNITV_KEYSTORE_PASSWORD}"
              echo "SIGNING_MODE=producción"
            } >> "$GITHUB_ENV"
            echo "::notice::APK firmado con la keystore de producción"
          else
            echo "SIGNING_MODE=depuración (sideload)" >> "$GITHUB_ENV"
            echo "::warning::Sin secretos OMNITV_KEYSTORE_*: el APK se firmará con la clave de depuración. No sirve para actualizar una instalación firmada con producción."
          fi

      - name: Validar firma antes de publicar
        run: |
          if [ "$PUBLISH" = "true" ] && [ "$SIGNING_MODE" != "producción" ]; then
            echo "::error::Una Release versionada exige la keystore de producción. Configura OMNITV_KEYSTORE_BASE64, OMNITV_KEYSTORE_PASSWORD y OMNITV_KEY_ALIAS."
            exit 1
          fi
          if [ "$PUBLISH_DEV" = "true" ] && [ "$SIGNING_MODE" != "producción" ]; then
            echo "PUBLISH_DEV=false" >> "$GITHUB_ENV"
            echo "::warning::No se actualiza latest: falta la firma de producción. El APK de prueba quedará solo como artefacto."
          fi

      - name: Versión para esta compilación
        if: github.event.inputs.version != ''
        run: |
          # Reescribe sólo el versionName; el versionCode se mantiene.
          sed -i -E "s/versionName *= *\"[^\"]*\"/versionName = \"${{ github.event.inputs.version }}\"/" app/build.gradle.kts
          grep -nE "versionCode|versionName" app/build.gradle.kts

      - name: Tests y compilación
        run: |
          set -o pipefail
          TASK="assembleRelease"
          if [ "$VARIANT" = "debug" ]; then TASK="assembleDebug"; fi
          ./gradlew --no-daemon :app:testDebugUnitTest ":app:$TASK" 2>&1 | tee build-apk.log

      - name: Mostrar errores si falla
        if: failure()
        run: |
          tail -n 250 build-apk.log || true
          grep -E "^(e: |FAILURE|Execution failed|What went wrong)" build-apk.log | head -n 30 | while read -r line; do
            echo "::error::$line"
          done || true

      - name: Preparar el APK (nombre fijo OmniTV.apk)
        id: apk
        run: |
          set -euo pipefail
          APK=$(ls -1 app/build/outputs/apk/"$VARIANT"/*.apk | head -n1)
          VERSION=$(sed -nE 's/.*versionName *= *"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          CODE=$(sed -nE 's/.*versionCode *= *([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)

          # La Release adjunta un único archivo con nombre fijo. Así el botón
          # descarga el APK directamente, sin ZIP ni copias duplicadas.
          OUT="OmniTV.apk"
          cp "$APK" "$OUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          SIZE=$(du -h "$OUT" | cut -f1)

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)
          CERT=""
          if [ -n "$APKSIGNER" ]; then
            CERT=$("$APKSIGNER" verify --print-certs "$OUT" | sed -nE 's/.*certificate SHA-256 digest: *(.*)/\1/p' | head -n1)
          fi

          # Etiqueta de la release versionada (la «latest» usa otra fija).
          TAG="v${VERSION}"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

          ls -lh "$OUT"
          {
            echo "file=$OUT"
            echo "version=$VERSION"
            echo "code=$CODE"
            echo "sha=$SHA"
            echo "cert=$CERT"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### APK generado"
            echo
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Descarga directa (sin ZIP) | [\`$OUT\`](https://github.com/${{ github.repository }}/releases/download/latest/$OUT) |"
            echo "| Versión | $VERSION (versionCode $CODE) |"
            echo "| Tamaño | $SIZE |"
            echo "| Firma | $SIGNING_MODE |"
            echo "| SHA-256 del archivo | \`$SHA\` |"
            echo "| SHA-256 del certificado | \`${CERT:-no disponible}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el APK
        uses: actions/upload-artifact@v7
        with:
          name: OmniTV-apk-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 90

      # Release rodante: misma etiqueta SIEMPRE («latest»), así el enlace
      # /releases/download/latest/OmniTV.apk nunca cambia y el navegador
      # descarga el .apk directamente, sin ZIP y sin pasar por Artifacts.
      - name: Publicar Release «latest» (descarga directa permanente)
        if: env.PUBLISH_DEV == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OmniTV — última compilación
          prerelease: false
          # Debe ser la release «Latest» del repositorio: de ello depende el
          # enlace corto /releases/latest/download/OmniTV.apk. Como las
          # versionadas también adjuntan OmniTV.apk con make_latest: true, los
          # dos enlaces permanentes funcionan gane quien gane.
          make_latest: true
          generate_release_notes: false
          files: ${{ steps.apk.outputs.file }}
          body: |
            ### ⬇️ Descarga directa

            # [Descargar OmniTV.apk](https://github.com/${{ github.repository }}/releases/download/latest/OmniTV.apk)

            Enlace permanente, sin ZIP y sin descomprimir:

            ```
            https://github.com/${{ github.repository }}/releases/download/latest/OmniTV.apk
            ```

            Se corresponde con la **versión ${{ steps.apk.outputs.version }}**
            (versionCode ${{ steps.apk.outputs.code }}), compilada desde
            `main` el ${{ env.BUILD_DATE }}.

            | Dato | Valor |
            |---|---|
            | SHA-256 del archivo | `${{ steps.apk.outputs.sha }}` |
            | SHA-256 del certificado | `${{ steps.apk.outputs.cert }}` |
            | Firma | ${{ env.SIGNING_MODE }} |
            | Commit | `${{ github.sha }}` |

            La Release adjunta **solamente `OmniTV.apk`**; no hay ZIP ni una
            segunda copia del mismo binario.

            **Instalar en la TV:**

            ```bash
            adb connect <IP_DE_LA_TV>:5555
            adb install -r OmniTV.apk
            ```

            O descarga el archivo y ábrelo desde la TV (requiere permitir
            orígenes desconocidos en Ajustes → Seguridad).

      - name: Publicar Release con descarga directa
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: OmniTV ${{ steps.apk.outputs.version }}
          generate_release_notes: true
          # Un único adjunto: el APK instalable, sin ZIP ni copia duplicada.
          files: ${{ steps.apk.outputs.file }}
          # Marca esta release como la más reciente del repositorio.
          make_latest: true
          body: |
            ### OmniTV ${{ steps.apk.outputs.version }} — Android TV

            ## ⬇️ Descarga directa (sin ZIP)

            **[OmniTV.apk](https://github.com/${{ github.repository }}/releases/latest/download/OmniTV.apk)**

            Ese enlace es **permanente**: siempre apunta al último APK publicado y
            el archivo se descarga con el nombre `OmniTV.apk`, sin descomprimir nada.
            Esta versión también se descarga directamente desde
            [`${{ steps.apk.outputs.tag }}/OmniTV.apk`](https://github.com/${{ github.repository }}/releases/download/${{ steps.apk.outputs.tag }}/OmniTV.apk).
            La Release adjunta **solamente ese APK**.

            ## 📺 Instalación en la TV

            1. Descarga `OmniTV.apk` (o instálalo con `adb`).
            2. Llévalo a la TV con `adb install -r OmniTV.apk`, un USB o «Send Files to TV».
            3. En la TV: Ajustes → Seguridad → permitir orígenes desconocidos.

            ```bash
            adb connect <IP_DE_LA_TV>:5555
            adb install -r OmniTV.apk
            ```

            ## 🔐 Integridad

            | Dato | Valor |
            |---|---|
            | Versión | `${{ steps.apk.outputs.version }}` (versionCode ${{ steps.apk.outputs.code }}) |
            | SHA-256 del archivo | `${{ steps.apk.outputs.sha }}` |
            | SHA-256 del certificado | `${{ steps.apk.outputs.cert }}` |
            | Firma | ${{ env.SIGNING_MODE }} |

            Para comprobar la descarga antes de instalarla:

            ```bash
            sha256sum OmniTV.apk   # debe coincidir con el SHA-256 de arriba
            ```
