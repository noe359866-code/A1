name: Desplegar en Cloudflare Workers

# Despliegue manual e intencional, igual que el de Beamup: publicar un addon
# afecta a todos los usuarios que lo tienen instalado, así que nunca se
# dispara automáticamente en cada push.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sólo validar el bundle (no publicar)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler@4 requiere Node >= 22
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Verificar el bundle del Worker (sin publicar)
        run: npm run worker:check
      # Un `name` distinto en wrangler.toml publica en OTRO Worker y deja el
      # dominio con la versión vieja (fue la causa de que los arreglos no se
      # vieran en a1.noe359866.workers.dev). El nombre vive en un solo sitio.
      - name: El nombre del Worker coincide con el dominio publicado
        run: |
          set -euo pipefail
          expected="${{ vars.WORKER_NAME || 'a1' }}"
          actual="$(sed -n 's/^name *= *"\(.*\)"/\1/p' wrangler.toml | head -1)"
          echo "Worker esperado: $expected · encontrado: $actual"
          test "$actual" = "$expected" || {
            echo "::error::wrangler.toml publica en '$actual' pero el addon vive en '$expected'."
            exit 1
          }
      - name: Publicar en Cloudflare Workers
        if: ${{ !inputs.dry_run }}
        run: npm run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
