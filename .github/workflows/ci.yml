# Comprobaciones de cada push y pull request.
#
# - Los tests unitarios de JVM cubren la parte que más se rompe sin avisar:
#   la política de red (http solo en la LAN), el panel de vinculación (sin
#   código no se entrega nada) y los dos parsers de HTML.
# - assembleDebug verifica que la app compila de verdad (dependencias de
#   Compose TV, Media3, ZXing…). El build de release no se hace aquí porque
#   necesita un keystore que no debe estar en el repositorio.
#
# Las versiones de las acciones se fijan a las que se ejecutan sobre Node 24
# (las de Node 20 están retiradas y GitHub las rechaza con un aviso).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests unitarios y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Caché estándar de GitHub Actions (no requiere ningún servicio externo)
          cache-provider: basic

      - name: Aceptar las licencias del SDK de Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null; fi

      # `pipefail` es imprescindible: sin él, el código de salida sería el de `tee`
      # y un fallo de Gradle pasaría por bueno.
      - name: Tests unitarios
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee build-tests.log

      - name: Compilar la app (debug)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee build-app.log

      # Deja constancia en el resumen del job de cuántos tests se ejecutaron.
      - name: Recuento de tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          total = failed = 0
          for xml in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              data = open(xml, encoding='utf-8', errors='replace').read()
              total += len(re.findall(r'<testcase\b', data))
              failed += len(re.findall(r'<(?:failure|error)\b', data))
          print(f'::notice::Tests ejecutados: {total} · fallos: {failed}')
          if failed:
              print('::error::Hay tests que fallan')
          elif total == 0:
              print('::error::No se ejecutó ningún test')
          PY

      # Si algo falla, lo importante aparece como anotación en el resumen del
      # job (los informes completos se suben como artefacto).
      - name: Resumen de los fallos
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, html, re
          def note(text):
              print('::error::' + text.replace('\n', ' ').replace('\r', ' ')[:900])
          for log in ('build-tests.log', 'build-app.log'):
              try:
                  lines = open(log, encoding='utf-8', errors='replace').read().splitlines()
              except FileNotFoundError:
                  continue
              errors = [l for l in lines if re.match(r'^(e: |FAILURE:|\* What went wrong|Execution failed)', l)]
              for line in errors[:40]:
                  note(line)
              for line in [l for l in lines if 'FAILED' in l][:8]:
                  note(line)
              # La causa suele estar justo después de «What went wrong»
              for i, line in enumerate(lines):
                  if '* What went wrong' in line:
                      for extra in lines[i:i + 6]:
                          note(extra)
                      break
          for xml in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              data = open(xml, encoding='utf-8', errors='replace').read()
              for case in re.finditer(r'<testcase name="([^"]*)"[^>]*>(.*?)</testcase>', data, re.S):
                  failure = re.search(r'<(?:failure|error)[^>]*message="([^"]*)"', case.group(2))
                  if failure:
                      note(case.group(1) + ' → ' + html.unescape(failure.group(1)))
          PY

      - name: Guardar el informe de los tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
