# Comprobaciones de cada push y pull request.
#
# - Los tests unitarios de JVM cubren la parte que más se rompe sin avisar:
#   la política de red (http solo en la LAN), el panel de vinculación (sin
#   código no se entrega nada) y los dos parsers de HTML.
# - assembleDebug y lintDebug verifican compilación y análisis Android.
# - El contrato estático comprueba que no se añada un launcher de móvil.
#   La distribución actual es sideload; release usa firma debug (no Play Store).
#
# Las versiones de las acciones se fijan a las que se ejecutan sobre Node 24
# (las de Node 20 están retiradas y GitHub las rechaza con un aviso).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests unitarios y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Caché estándar de GitHub Actions (no requiere ningún servicio externo)
          cache-provider: basic

      - name: Aceptar las licencias del SDK de Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null; fi

      - name: Contrato de Android TV
        run: python3 tools/check_android_tv.py

      # `pipefail` es imprescindible: sin él, el código de salida sería el de `tee`
      # y un fallo de Gradle pasaría por bueno.
      - name: Puente Nuvio (HTTP y worker JS)
        run: node --test tools/nuvio-bridge/bridge.test.mjs

      - name: Puente Cloudstream (runtime externo)
        run: node --test tools/cloudstream-bridge/bridge.test.mjs

      - name: Tests unitarios
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee build-tests.log

      - name: Compilar la app (debug)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee build-app.log

      - name: Lint Android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintDebug 2>&1 | tee build-lint.log

      - name: Anotar los errores de lint
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('app/build/reports/lint-results-debug.xml')
          if path.exists():
              for issue in ET.parse(path).getroot().findall('issue'):
                  if issue.get('severity') not in ('Error', 'Fatal'):
                      continue
                  loc = issue.find('location')
                  file = loc.get('file', '') if loc is not None else ''
                  line = loc.get('line', '1') if loc is not None else '1'
                  message = issue.get('message', '').replace('\n', ' ')
                  print(f'::error file={file},line={line}::[{issue.get("id")}] {message}')
          PY

      # Los avisos del compilador (w:) quedan como anotación del job.
      - name: Avisos del compilador
        if: always()
        run: |
          python3 - <<'PY'
          import re
          try:
              lines = open('build-app.log', encoding='utf-8', errors='replace').read().splitlines()
          except FileNotFoundError:
              raise SystemExit(0)
          warnings = [l for l in lines if l.startswith('w: ')]
          for line in warnings[:15]:
              print('::warning::' + line[3:900])
          if warnings:
              print(f'::notice::Avisos del compilador: {len(warnings)}')
          PY

      # Deja constancia en el resumen del job de cuántos tests se ejecutaron.
      - name: Recuento de tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          total = failed = 0
          for xml in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              data = open(xml, encoding='utf-8', errors='replace').read()
              total += len(re.findall(r'<testcase\b', data))
              failed += len(re.findall(r'<(?:failure|error)\b', data))
          print(f'::notice::Tests ejecutados: {total} · fallos: {failed}')
          if failed:
              print('::error::Hay tests que fallan')
          elif total == 0:
              print('::error::No se ejecutó ningún test')
          if failed or total == 0:
              raise SystemExit(1)
          PY

      # Si algo falla, lo importante aparece como anotación en el resumen del
      # job (los informes completos se suben como artefacto).
      - name: Resumen de los fallos
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, html, re
          def note(text):
              print('::error::' + text.replace('\n', ' ').replace('\r', ' ')[:900])
          for log in ('build-tests.log', 'build-app.log', 'build-lint.log'):
              try:
                  lines = open(log, encoding='utf-8', errors='replace').read().splitlines()
              except FileNotFoundError:
                  continue
              errors = [l for l in lines if re.match(r'^(e: |FAILURE:|\* What went wrong|Execution failed)', l)]
              for line in errors[:40]:
                  note(line)
              for line in [l for l in lines if 'FAILED' in l][:8]:
                  note(line)
              # La causa suele estar justo después de «What went wrong»
              for i, line in enumerate(lines):
                  if '* What went wrong' in line:
                      for extra in lines[i:i + 6]:
                          note(extra)
                      break
          for xml in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              data = open(xml, encoding='utf-8', errors='replace').read()
              for case in re.finditer(r'<testcase name="([^"]*)"[^>]*>(.*?)</testcase>', data, re.S):
                  failure = re.search(r'<(?:failure|error)[^>]*message="([^"]*)"', case.group(2))
                  if failure:
                      note(case.group(1) + ' → ' + html.unescape(failure.group(1)))
          PY

      - name: Guardar el informe de los tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-tests
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            build-lint.log
          if-no-files-found: ignore
