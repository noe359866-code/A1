name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Incluye el contrato de Beamup (linter oficial del manifiesto + PORT)
      # y tests/worker.test.js (contrato de Cloudflare Workers).
      - run: npm test
      # Comprueba que el bundle del Worker se construye sin nodejs_compat.
      # wrangler@4 exige Node >= 22, así que sólo se ejecuta en ese escalón.
      - name: Bundle de Cloudflare Workers
        if: matrix.node-version == 22
        run: npm run worker:check
