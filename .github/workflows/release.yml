name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para el release (ej: v1.2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validar origen y etiqueta de release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Las releases manuales solo se pueden crear desde main."
            exit 1
          fi
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Etiqueta inválida: usa vX.Y.Z (por ejemplo v1.4.0)."
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Aceptar licencias Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null; fi

      - name: Preparar firma de producción (si hay secretos)
        env:
          OMNITV_KEYSTORE_BASE64: ${{ secrets.OMNITV_KEYSTORE_BASE64 }}
          OMNITV_KEYSTORE_PASSWORD: ${{ secrets.OMNITV_KEYSTORE_PASSWORD }}
          OMNITV_KEY_ALIAS: ${{ secrets.OMNITV_KEY_ALIAS }}
          OMNITV_KEY_PASSWORD: ${{ secrets.OMNITV_KEY_PASSWORD }}
        run: |
          if [ -n "$OMNITV_KEYSTORE_BASE64" ] && [ -n "$OMNITV_KEYSTORE_PASSWORD" ] && [ -n "$OMNITV_KEY_ALIAS" ]; then
            echo "$OMNITV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omnitv-release.jks"
            echo "OMNITV_KEYSTORE_FILE=$RUNNER_TEMP/omnitv-release.jks" >> "$GITHUB_ENV"
            echo "OMNITV_KEYSTORE_PASSWORD=$OMNITV_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "OMNITV_KEY_ALIAS=$OMNITV_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "OMNITV_KEY_PASSWORD=${OMNITV_KEY_PASSWORD:-$OMNITV_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=keystore de producción" >> "$GITHUB_ENV"
            echo "::notice::APK firmado con keystore de producción"
          else
            echo "::error::No se publican releases firmadas con debug. Configura OMNITV_KEYSTORE_BASE64, OMNITV_KEYSTORE_PASSWORD y OMNITV_KEY_ALIAS."
            exit 1
          fi
          test -s "$RUNNER_TEMP/omnitv-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/omnitv-release.jks" -storepass "$OMNITV_KEYSTORE_PASSWORD" -alias "$OMNITV_KEY_ALIAS" > /dev/null
          echo "::notice::Keystore de producción y alias verificados"

      - name: Build APK release
        run: |
          set -o pipefail
          python3 tools/check_android_tv.py
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease 2>&1 | tee build-release.log

      - name: Mostrar errores si falla
        if: failure()
        run: |
          echo "=== build-release.log (ultimas 300 lineas) ==="
          tail -n 300 build-release.log || true
          echo "=== Fin log ==="
          # Extraer lineas de error como anotaciones
          grep -E "^(e: |FAILURE|Execution failed|What went wrong)" build-release.log | head -n 30 | while read l; do echo "::error::$l"; done || true

      - name: Subir log como artefacto (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-release-log
          path: build-release.log
          if-no-files-found: ignore

      - name: Preparar un único APK para la Release
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "" ]; then TAG="v${VERSION}"; fi
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; fi
          # Un solo adjunto con nombre fijo: descarga directa, sin ZIP ni copia.
          OUT="OmniTV.apk"
          cp "$APK" "$OUT"
          ls -lh "$OUT" "$APK"
          echo "APK_OUT=$OUT" >> $GITHUB_ENV
          echo "APK_TAG=$TAG" >> $GITHUB_ENV

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APK_TAG }}
          name: OmniTV ${{ env.APK_TAG }}
          generate_release_notes: true
          files: ${{ env.APK_OUT }}
          make_latest: true
          body: |
            ### OmniTV ${{ env.APK_TAG }} — Android TV

            ## ⬇️ Descarga directa (sin ZIP)

            **[OmniTV.apk](https://github.com/${{ github.repository }}/releases/latest/download/OmniTV.apk)**

            Enlace permanente al último APK; se descarga con el nombre `OmniTV.apk`
            ya listo para instalar. Esta Release adjunta **solamente ese APK**, sin
            ZIP ni una segunda copia. Enlace de esta versión:
            [`${{ env.APK_TAG }}/OmniTV.apk`](https://github.com/${{ github.repository }}/releases/download/${{ env.APK_TAG }}/OmniTV.apk).

            **Instalación (sideload):**
            1. Descarga `OmniTV.apk`
            2. Envía a la TV con `adb install -r OmniTV.apk` o gestor de archivos (X-plore, Send Files to TV)
            3. En la TV: Ajustes → Seguridad → permitir orígenes desconocidos

            **Novedades:**
            - Reproductor cinemático premium (scrims, timeline 3m, auto-next 10s)
            - Extractores de embeds cableados a StreamHub, con cabeceras y subtítulos externos hasta Media3
            - Cliente HTTP único (AddonHttp) para addons y scraping; Cronet instalado en el ImageLoader de Coil
            - Cachés de plataforma/estudio con TTL y errores de red distinguibles en Home/Buscar
            - Panel de vinculación con rechazo de orígenes cruzados

            _Firma: ${{ env.SIGNING_MODE }}. Configura los secretos `OMNITV_KEYSTORE_BASE64`, `OMNITV_KEYSTORE_PASSWORD`, `OMNITV_KEY_ALIAS` y `OMNITV_KEY_PASSWORD` para publicar con clave de producción._
