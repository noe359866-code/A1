services:
  omni-index:
    build: .
    image: omni-index:latest
    container_name: omni-index
    ports:
      - "7000:7000"
    environment:
      PORT: "7000"
      HOST: "0.0.0.0"
      OMNI_CACHE_TTL: "900"
      # OMNI_PREDATABA_KEY: ""
      # OMNI_CONFIG: '{"maxStreams":30,"enableCatalog":false}'
    restart: unless-stopped
