# Omni Index · Cloudflare Workers
# Guía completa: docs/CLOUDFLARE.md
# Comandos: npx wrangler@4 dev | npx wrangler@4 deploy
#           (o `npm run worker:dev` / `npm run worker:deploy`)

name = "omni-index"
main = "src/worker.js"
workers_dev = true
compatibility_date = "2025-06-01"

# El addon NO necesita nodejs_compat: el núcleo usa únicamente APIs web
# (Request, Response, fetch, TextEncoder/TextDecoder, atob/btoa, URL).
compatibility_flags = []

# Los estáticos de marca se publican con Workers Assets. `run_worker_first`
# garantiza que TODAS las peticiones pasen por src/worker.js: así añadimos
# CORS, inyectamos el bootstrap en /configure y servimos /c/<config>/logo.png.
[assets]
directory = "src/public"
binding = "ASSETS"
run_worker_first = true

# Variables públicas (equivalentes a las de .env.example / Beamup).
# En producción normalmente NO hace falta OMNI_PUBLIC_URL: el manifiesto usa
# el origen real de request.url. Descomenta lo que necesites.
[vars]
# OMNI_PUBLIC_URL = "https://addon.tudominio.com"
# OMNI_CONFIG = "{\"maxStreams\":30,\"cacheTtl\":900,\"enableCatalog\":false}"
# OMNI_HTTP_TIMEOUT = "9000"
# OMNI_USER_AGENT = "OmniIndexStremioAddon/1.0"
# OMNI_QUIET = "1"
# OMNI_XREL_BASE = "https://api-alternate.xrel.top"
# OMNI_KNABEN_BASE = "https://api.knaben.org"
# OMNI_TORRENTS_CSV_BASE = "https://torrents-csv.com"
# OMNI_TORLOCK_BASE = "https://www.torlock.com"
# OMNI_PREDB_NET_BASE = "https://api.predb.net"
# OMNI_PREDATABA_SE_BASE = "https://predataba.se"
# OMNI_CINEMETA_BASE = "https://v3-cinemeta.strem.io"
# OMNI_ANIME_KITSU_BASE = "https://anime-kitsu.strem.fun"

# Secretos: NO van en este fichero. Se crean con
#   npx wrangler@4 secret put OMNI_PREDATABA_KEY
# y en GitHub Actions se inyectan como CLOUDFLARE_API_TOKEN / secrets.

[observability]
enabled = true
